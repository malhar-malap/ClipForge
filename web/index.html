<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=cf4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E8;--panel:#FFFDF9;--sunk:#F1EADF;--line:#E6DDCE;--line-2:#D6CBB8;
  --text:#1C1B19;--dim:#6E6A62;--faint:#A29C91;--ink:#1C1B19;
  --accent:#E4572E;--accent-soft:#FBE7DE;--peach:#F7D7C2;--sage:#D8E2CF;--lilac:#E2DCEF;--butter:#F3E3B3;--sky:#D3E3EC;
  --serif:"Instrument Serif",Georgia,serif;--ease:cubic-bezier(.2,.8,.2,1);
  --good:#1E7F4F;--good-soft:#E8F4EC;--warn:#8A5A00;--warn-soft:#FBF3E2;--bad:#C2352B;--bad-soft:#FBECEA;
  --r:8px;--r-lg:12px;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 "Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:16px;height:16px;flex:none;fill:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;outline:none}
textarea{height:auto;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:500;color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r);border:1px solid var(--line-2);background:#fff;color:var(--text);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:#33332f}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim)}.btn.ghost:hover{background:var(--sunk);color:var(--text)}
.btn.danger{color:var(--bad)}.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}.btn.icon{width:30px;padding:0}
.btn:disabled{opacity:.45;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--dim);white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.blue{background:var(--accent-soft);color:var(--accent)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.muted{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .4s ease}

.mins{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--dim);text-decoration:none}
.mins b{color:var(--text);font-weight:600}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;border:0;cursor:pointer}
.menu{position:fixed;right:18px;top:58px;width:230px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:6px;z-index:30}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{display:block}.menu .who span{font-size:12.5px;color:var(--dim)}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:9px;height:34px;padding:0 10px;border:0;background:none;border-radius:6px;text-decoration:none;cursor:pointer;text-align:left}
.menu a:hover,.menu button:hover{background:var(--sunk)}

.notice{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:10px 12px 10px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);background:#fff;font-size:13.5px}
.notice.warn{border-left-color:#C98A00}.notice span{flex:1}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.015em}
.ph p{color:var(--dim);margin-top:3px}
.crumb{font-size:13px;color:var(--dim);margin-bottom:6px;display:flex;align-items:center;gap:10px}
.backbtn{padding-left:8px}.backbtn svg{transform:scaleX(-1)}.crumb a{text-decoration:none}.crumb a:hover{color:var(--text)}

.selbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.selbar.quiet{padding:8px 14px}
.lrow[data-act=selone]{cursor:pointer}.lrow.picked{background:var(--accent-soft)}
.thumb{position:relative}.thumb .tick{position:absolute;left:6px;top:6px;width:22px;height:22px;border-radius:7px;border:2px solid #fff;background:rgba(28,27,25,.35);display:grid;place-items:center;z-index:1}
.thumb .tick.on{background:var(--accent);border-color:var(--accent)}.thumb .tick svg{width:14px;height:14px;fill:#fff}
.btn.dangertext,.btn.ghost.dangertext{color:var(--bad)}.btn.dangertext:hover{color:var(--bad);background:var(--bad-soft)}
.plans-h{font-family:var(--serif);font-weight:400;font-size:30px;margin:34px 0 4px;display:flex;align-items:center;gap:10px}.plans-h em{color:var(--accent)}
.plans-sub{margin:0 0 14px}.plans.two{grid-template-columns:repeat(2,minmax(0,1fr));max-width:760px}
.byok-note{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:16px;padding:16px 20px;margin:0 0 16px;max-width:900px}
.byok-note h3{margin:0 0 8px;font-size:15px}.byok-note ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text)}
@media (max-width:760px){.plans.two{grid-template-columns:1fr}}
.share{margin-top:18px;border:1.5px solid var(--line);border-radius:18px;padding:18px;background:var(--panel)}
.share h3{margin:0;font-family:var(--serif);font-weight:400;font-size:24px}.share-h{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.acctlist{display:flex;flex-direction:column;gap:8px}
.acct{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,background-color .15s}
.acct:hover{border-color:var(--line-2);background:var(--sunk)}.acct.on{border-color:var(--accent);background:var(--accent-soft)}
.acct-t{flex:1;display:flex;flex-direction:column;min-width:0}.acct-t b{font-size:15px;font-weight:600}.acct-t small{color:var(--dim);font-size:12.5px}
.acct-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-2);display:grid;place-items:center}.acct-box svg{width:14px;height:14px;fill:transparent}
.acct.on .acct-box{background:var(--accent);border-color:var(--accent)}.acct.on .acct-box svg{fill:#fff}
.pf{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.share-acts{display:flex;gap:10px;margin-top:14px}.share-go{flex:1;height:48px;font-size:16px}
.poststat{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.poststat li{display:flex;gap:12px;align-items:flex-start}.ps-body{flex:1;min-width:0}.ps-body b{font-size:14px}
.ps-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:4px}
.ps{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--dim)}.ps svg{width:16px;height:16px;fill:currentColor}
.ps.ok{color:var(--good);font-weight:600}.ps.bad{color:var(--bad);font-weight:600}.ps.run{color:var(--text);font-weight:600}.ps-note{flex-basis:100%}
.toast.party{display:flex;align-items:center;gap:12px;background:var(--panel);color:var(--text);border:1.5px solid var(--accent)}
.toast.party .pop{font-size:30px;display:inline-block;animation:popin .6s cubic-bezier(.2,1.6,.4,1) both}.toast.party a{color:var(--accent);font-weight:600;white-space:nowrap}
@keyframes popin{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.ws>*,.edit>*,.edit .form>*{min-width:0}.edit .form{grid-template-columns:minmax(0,1fr)}   /* the clip strip and the style rows scroll inside their own boxes on phones, never the whole page */
.useline{margin-top:8px}.useline:empty{display:none}
.tl{margin-top:14px}.tl-head{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:8px}.tl-head span{color:var(--dim)}
.tl-track{position:relative;height:40px;border-radius:10px;background:repeating-linear-gradient(90deg,var(--sunk) 0 6px,var(--line) 6px 7px);cursor:pointer;touch-action:none}
.tl-win{position:absolute;top:0;bottom:0;border-radius:10px;background:rgba(228,87,46,.16);border:2px solid var(--accent);cursor:grab;transition:background-color .15s}
.tl-win:hover{background:rgba(228,87,46,.24)}
.tl-h{position:absolute;top:6px;bottom:6px;width:6px;border-radius:3px;background:var(--accent);cursor:ew-resize}.tl-h.l{left:3px}.tl-h.r{right:3px}
.tl-tip{position:absolute;bottom:48px;width:160px;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none;z-index:3}
.tl-tip canvas{width:160px;height:90px;border-radius:8px;background:#1C1B19;border:2px solid var(--panel)}.tl-tip canvas[hidden]{display:none}
.tl-tip span{font-size:12px;font-weight:600;background:var(--ink);color:#F6F1E8;padding:2px 8px;border-radius:999px}
.tl-scale{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin:4px 0 6px}
.sgroup h4{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel);color:var(--dim);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;transition:border-color .15s,color .15s,background-color .15s}
.chip:hover{border-color:var(--line-2);color:var(--text);background:var(--sunk)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text);font-weight:600}
.chipset.mini{margin-top:8px}.chipset.mini .chip{padding:4px 12px;font-size:12.5px}
.chipset.lens{display:grid;grid-template-columns:1fr 1fr}.chip.big{border-radius:12px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px}
.chip.big b{font-weight:600;color:inherit}.chip.big small{font-size:11.5px;color:var(--faint)}
.chipset.seg{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--line);border-radius:999px;padding:3px}.chipset.seg .chip{border:0;border-radius:999px;text-align:center}
.chipset.seg .chip.on{background:var(--ink);color:#F6F1E8}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;width:max-content}
.stepper button{width:44px;height:44px;border:0;background:var(--sunk);font-size:22px;color:var(--text);cursor:pointer;transition:background-color .15s,color .15s}
.stepper button:hover{background:var(--accent-soft);color:var(--accent)}
.stepper input{width:64px;height:44px;border:0!important;text-align:center;font-family:var(--serif);font-size:26px;background:var(--panel);-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.pickrow{margin-bottom:16px}.pickrow h4{margin:0 0 8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:thin}
.tile{flex:none;display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 6px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer;transition:border-color .15s,color .15s,background-color .15s}
.tile:hover{border-color:var(--line-2);color:var(--text);background:var(--sunk)}
.tile.on{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}.tile.on span{font-weight:600}
.pa{position:relative;display:block;overflow:hidden;border-radius:9px;background:#1C1B19}
.pa.cam{width:58px;height:103px}
.pa-game{position:absolute;inset:0;background:linear-gradient(160deg,#3B4A3A,#2A3340 60%,#4A3A2E);background-size:cover;background-position:center}
.pa-game.half{top:50%}.pa-game.blurfill{filter:blur(3px) brightness(.6)}.pa-game.fit{top:44%;bottom:auto;height:30%}.pa-game.fit.mid{top:35%}.pa-face.fittop{height:38%}
.pa-face{position:absolute;display:grid;place-items:end center;overflow:hidden;background:var(--peach)}
.pa-face svg{width:70%;fill:#C9876A}
.pa-face.top{left:0;right:0;top:0;height:50%}.pa-face.top svg{width:42%}
.pa-face.circ{width:24px;height:24px;left:17px;top:9px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.pa-face.win{width:30px;height:21px;left:14px;top:9px;border-radius:4px;box-shadow:0 0 0 2px #fff}
.pa-face.bot{left:0;right:0;bottom:0;height:50%;border-top:2px solid #1C1B19}.pa-face.bot svg,.pa-face.top svg{width:42%}
.pa-face.full{inset:0}.pa-face.full svg{width:66%}
.pa-auto{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--ink);color:#F6F1E8}.pa-auto b{font-family:var(--serif);font-size:24px;font-weight:400;color:var(--accent)}.pa-auto small{font-size:10px;opacity:.7}
.pa-field{background:repeating-linear-gradient(0deg,#3E7A3A 0 12px,#478A42 12px 24px)}.pa-field i{position:absolute;left:8px;right:8px;top:50%;height:2px;background:rgba(255,255,255,.7)}.pa-field i.ball{left:24px;right:auto;top:30px;width:9px;height:9px;border-radius:50%;background:#fff}
.pa.cap{width:124px;height:70px;display:grid;place-items:center}
.pa-words{color:#fff;font-size:15px;line-height:1.1;text-align:center;-webkit-text-stroke:.6px #000;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pa-words.box{padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.14);-webkit-text-stroke:0}
.pa-words b{font-weight:inherit}.pa-words b.box{color:#14100E;-webkit-text-stroke:0;text-shadow:none;padding:0 4px;border-radius:4px}
.ups{margin-top:12px;display:grid;gap:8px}
.up{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;font-size:13px}

.empty{padding:48px 20px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* project workspace */
.ws{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.clips{padding:6px;max-height:calc(100vh - 190px);overflow:auto;position:sticky;top:76px}
.ci{display:grid;grid-template-columns:54px minmax(0,1fr);gap:11px;padding:8px;border-radius:var(--r);cursor:pointer;border:1px solid transparent}
.ci:hover{background:var(--sunk)}
.ci.on{background:var(--accent-soft);border-color:#D6E0FB}
.ci .cv{width:54px;aspect-ratio:9/16;border-radius:5px;background:#26252200;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--faint);position:relative}
.ci .cv img{width:100%;height:100%;object-fit:cover}
.ci .h{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci .s{display:flex;gap:6px;align-items:center;margin-top:5px;font-size:12px;color:var(--dim)}
.score{font-weight:600;color:var(--text)}
.ci .vs{display:flex;align-items:baseline;gap:4px;margin-top:4px;font-size:12px;color:var(--dim)}
.ci .vs .score{font-size:15px}
.edit{padding:20px;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px}
.stage{position:relative;width:100%;aspect-ratio:9/16;background:#141412;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#bbb;font-size:13px;text-align:center}
.stage video.final{width:100%;height:100%;object-fit:contain;background:#000}
.stage .msg{padding:18px;display:grid;gap:10px;justify-items:center}
.stage .msg svg{width:22px;height:22px}
.form{display:grid;gap:12px;align-content:start}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form h3{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.why{padding:10px 12px;border-radius:var(--r);background:var(--sunk);font-size:13px;color:var(--dim)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.ck{display:flex;align-items:center;gap:8px;font-size:13.5px}

/* preview player */
.pv{position:absolute;inset:0;cursor:pointer}
.pv-p{position:absolute;overflow:hidden}.pv-p video{position:absolute;max-width:none;max-height:none}
.pv-p.bg video{filter:blur(18px) brightness(.7)}
.pv-p.bub{border-radius:50%;box-shadow:0 0 0 3px #fff}.pv-p.pipw{border-radius:10px;box-shadow:0 0 0 3px #fff}
.pv-cap{position:absolute;left:5%;right:5%;text-align:center;font:800 20px/1.15 Poppins,system-ui,sans-serif;color:#fff;text-transform:uppercase;-webkit-text-stroke:1px #000;text-shadow:0 2px 6px rgba(0,0,0,.8);pointer-events:none}
.pv-cap b{color:#FFE14D}
.pv-hook{position:absolute;left:50%;transform:translate(-50%,-50%);background:#fff;color:#191917;font:800 15px/1.2 Poppins,system-ui,sans-serif;padding:6px 12px;border-radius:10px;max-width:86%;text-align:center;pointer-events:none}
.pv-wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 26px Inter,sans-serif;color:rgba(255,255,255,.22);transform:rotate(-24deg);letter-spacing:.2em}
.pv-play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.pv-play span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#191917}.pv-play svg{width:20px;height:20px;margin-left:3px}

/* live */
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch{padding:16px;display:grid;gap:12px}
.ch h3{font-size:15px;font-weight:600}
.ch .links{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:#fff;padding:10px 12px}.stats b{display:block;font-size:17px;font-weight:600}.stats span{font-size:12px;color:var(--dim)}

/* plans */
.now{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:24px}
.now h2{font-size:20px;font-weight:600;margin:2px 0 4px}
.now .big{text-align:right;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.now .big span{display:block;font-size:12.5px;font-weight:400;color:var(--dim);margin-top:6px;letter-spacing:0}
.now .bar{max-width:420px;margin:12px 0 6px;height:6px}
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
.plan{padding:18px;display:flex;flex-direction:column;gap:12px}
.plan.mine{border-color:var(--ink)}
.plan .pr{font-size:26px;font-weight:600;letter-spacing:-.02em}.plan .pr small{font-size:13px;color:var(--dim);font-weight:400;margin-left:3px}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:7px;font-size:13px;color:var(--dim);flex:1}
.plan li{display:flex;gap:7px}.plan li svg{color:var(--text);margin-top:2px;width:15px;height:15px}
.plan .btn{width:100%}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.faq div{padding:14px 0;border-top:1px solid var(--line)}.faq b{display:block;margin-bottom:3px}.faq p{color:var(--dim);font-size:13.5px}
.sect{padding:20px;margin-bottom:16px}
.sect h2{font-size:15px;font-weight:600;margin-bottom:4px}.sect>p{color:var(--dim);margin-bottom:14px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:720px}

/* settings */
.set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.set nav{display:grid;gap:2px;position:sticky;top:76px}
.set nav a{height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:var(--r);text-decoration:none;color:var(--dim);font-weight:500}
.set nav a:hover{background:var(--sunk);color:var(--text)}.set nav a.on{background:#fff;border:1px solid var(--line);color:var(--text)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:9px 10px;border-top:1px solid var(--line);text-align:left}
table.t th{font-weight:500;color:var(--faint);font-size:12px;border-top:0}

dialog{border:1px solid var(--line);border-radius:var(--r-lg);padding:0;max-width:440px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(20,20,18,.35)}
dialog .dl{padding:20px;display:grid;gap:12px}dialog h2{font-size:16px;font-weight:600}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:50}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r);font-size:13.5px}
.toast.bad{background:var(--bad)}
.lmark{--s:40px;position:relative;display:inline-grid;place-items:center;width:var(--s);height:var(--s);flex:none;vertical-align:middle}
.lmark svg{width:72%;height:72%;animation:lturn 2.4s cubic-bezier(.65,0,.35,1) infinite}
.lmark .ring{position:absolute;inset:0;border-radius:50%;border:max(2px,calc(var(--s)/18)) solid transparent;border-top-color:var(--accent);border-right-color:rgba(228,87,46,.35);animation:sp 1.1s linear infinite}
@keyframes lturn{0%,18%{transform:rotate(0) scale(1)}30%{transform:rotate(90deg) scale(.86)}42%,60%{transform:rotate(90deg) scale(1)}72%{transform:rotate(180deg) scale(.86)}84%,100%{transform:rotate(180deg) scale(1)}}
.badge .lmark{margin-right:4px}.badge .lmark .ring{border-width:2px}
.forge{display:flex;gap:18px;align-items:flex-start;padding:18px 20px;margin-bottom:18px}
.forge-body{flex:1;min-width:0}.forge-body .row{gap:12px;margin-bottom:10px}.forge-pct{font-family:var(--serif);font-size:26px;color:var(--accent);line-height:1}
.steps{list-style:none;padding:0;margin:14px 0 10px;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--faint)}
.steps li{display:flex;align-items:center;gap:6px}.steps li svg{width:15px;height:15px;fill:var(--good)}
.steps .dot{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.steps li.done{color:var(--dim)}.steps li.cur{color:var(--text);font-weight:600}.steps li.cur .dot{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}
.waitbox{display:flex;flex-direction:column;align-items:center;gap:10px}.waitbox .lmark{margin-bottom:6px}
.msg .lmark{margin-bottom:4px}
@media (prefers-reduced-motion:reduce){.lmark svg,.lmark .ring,.steps li.cur .dot{animation-duration:6s}}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid #555;border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.btn .spin{width:14px;height:14px;border-width:2px;border-color:rgba(28,27,25,.18);border-top-color:currentColor}
.btn.primary .spin{border-color:rgba(255,255,255,.3);border-top-color:#fff}
.btn.busy{pointer-events:none;opacity:.85}


/* ================================================================ ClipForge: type, colour and motion */
.ph h1,.now h2,.sect h2.big{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;letter-spacing:-.02em}
.ph h1 em,.now h2 em{font-style:italic;color:var(--accent)}
.ph p{font-size:15px}
.btn{border-radius:999px;transition:transform .2s var(--ease),background-color .2s,box-shadow .2s}
.btn:active{transform:translateY(0) scale(.98)}
.btn.icon{border-radius:50%}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{border-radius:10px;background:#FFFDF9}
.panel{border-radius:18px}
.mins{background:var(--panel)}
.mins b{font-family:var(--serif);font-size:17px;font-weight:400;color:var(--accent)}
.avatar{background:var(--accent);transition:background-color .2s}.avatar:hover{background:#C7431D}
.menu{border-radius:16px;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.notice{border-radius:14px;border-left-width:4px;animation:slide .45s var(--ease) both}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
/* page entrance and staggered items */
.enter>*{animation:rise .6s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.stagger>*{animation:rise .55s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.04s}.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.16s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.24s}.stagger>*:nth-child(7){animation-delay:.28s}.stagger>*:nth-child(n+8){animation-delay:.32s}
.calm .stagger>*,.calm.enter>*{animation:none}
.wsbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:-4px 0 18px}
.wschip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-weight:500;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.wschip span{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--sunk);color:var(--dim)}
.wschip:hover{color:var(--text);border-color:var(--line-2)}
.wschip.on{background:var(--ink);color:#F6F1E8;border-color:var(--ink)}.wschip.on span{background:rgba(255,255,255,.16);color:#F6F1E8}
.wschip.add{border-style:dashed}
.spvwrap{align-self:start}
.spv{position:relative;width:100%;aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#141412;animation:rise .5s var(--ease) both}
.spv .pv-p{position:absolute;overflow:hidden}.spv .pv-p.bg img{filter:blur(12px) brightness(.7)}
.spv .pv-p.bub{border-radius:50%;box-shadow:0 0 0 3px #fff}.spv .pv-p.pipw{border-radius:8px;box-shadow:0 0 0 3px #fff}
.spv .pv-hook{font-size:11px;padding:4px 8px;border-radius:7px}
.spcap{position:absolute;left:4%;right:4%;transform:translateY(-50%);text-align:center;font-size:19px;line-height:1.15;color:#fff;-webkit-text-stroke:1px #000;text-shadow:0 2px 5px rgba(0,0,0,.7);transition:all .25s var(--ease)}
.spcap.box{left:10%;right:10%;padding:5px 8px;border-radius:9px;background:rgba(0,0,0,.6);-webkit-text-stroke:0}
.spcap .pvw{display:inline-block}.spcap .pvw.on{transform:scale(1.12)}
.spcap .pvw.box{color:#14100E;-webkit-text-stroke:0;text-shadow:none;padding:0 5px;border-radius:5px}
.badge.blue{background:var(--accent-soft);color:var(--accent)}
.badge.blue .dot,.badge.bad .dot{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.badge.good{background:#E3EEDB;color:#2F6B3A}.badge.warn{background:#F8ECCB;color:#8A6200}
.bar{height:6px;border-radius:6px;background:var(--sunk)}
.bar i{background:linear-gradient(90deg,var(--accent),#F08A5D,var(--accent));background-size:200% 100%;animation:flow 2s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.empty b{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:6px}
/* workspace */
.ci{transition:background .2s,border-color .2s;border-radius:12px}
.ci.on{background:var(--accent-soft);border-color:#F3C8B6}
.ci .cv{border-radius:7px}
.score{font-family:var(--serif);font-size:17px;font-weight:400;color:var(--accent)}
.stage{border-radius:22px;animation:rise .6s var(--ease) both}
.form h3{color:var(--accent);letter-spacing:.1em}
.why{border-radius:12px;background:#FBF1E6;border:1px solid #F1DFCB}
.why .score{font-size:20px}
.ck input{accent-color:var(--accent)}
/* live */
.ch{transition:border-color .2s}.ch:hover{border-color:var(--line-2)}
.ch h3{font-family:var(--serif);font-weight:400;font-size:26px}
.stats b{font-family:var(--serif);font-weight:400;font-size:24px}
.stats{border-radius:14px}
/* plans */
.now{position:relative;overflow:hidden;background:var(--ink);color:#F6F1E8;border-color:var(--ink)}
.now .muted,.now .small{color:#C9C2B5!important}
.now::after{content:"";position:absolute;width:300px;height:300px;right:-80px;top:-140px;border-radius:50%;background:var(--accent);filter:blur(60px);opacity:.35}
.now>*{position:relative;z-index:1}
.now .big{font-family:var(--serif);font-weight:400;font-size:64px;color:#F3B79E}
.now .bar{background:rgba(255,255,255,.12)}
.plan{transition:border-color .2s}.plan:hover{border-color:var(--line-2)}
.plan .pr{font-family:var(--serif);font-weight:400;font-size:46px;letter-spacing:-.02em}
.plan:nth-child(1){background:#FBF3EA}.plan:nth-child(2){background:#FCEFE7}.plan:nth-child(3){background:#F1F4EC}.plan:nth-child(4){background:#F2EFF7}
.plan.mine{border:1.5px solid var(--accent)}
.plan li svg{color:var(--accent)}
.faq b{font-family:var(--serif);font-weight:400;font-size:21px}
/* settings */
.set nav a{border-radius:999px;transition:background .2s,color .2s}
.set nav a.on{border-color:var(--line);background:var(--panel)}
.sect h2{font-family:var(--serif);font-weight:400;font-size:24px}
dialog{border-radius:22px;animation:pop .25s var(--ease)}
dialog h2{font-family:var(--serif);font-weight:400;font-size:26px}
.toast{border-radius:999px;padding:10px 18px;animation:toast .35s var(--ease) both}
@keyframes toast{from{opacity:0;transform:translateY(12px) scale(.96)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:980px){.ws{grid-template-columns:1fr}.clips{position:static;max-height:none;display:flex;overflow-x:auto;gap:6px}.ci{min-width:240px}
  .edit{grid-template-columns:1fr}.stage{max-width:340px;margin:0 auto}.plans{grid-template-columns:1fr 1fr}.set{grid-template-columns:1fr}.set nav{position:static;display:flex;overflow:auto}}
@media (max-width:700px){.ph h1{font-size:36px}.plans,.faq{grid-template-columns:1fr}.now{grid-template-columns:1fr}.now .big{text-align:left}.stats{grid-template-columns:1fr 1fr}}

/* ================================================================ the shell: a slim rail on the left, a quiet strip on top */
body{padding-left:84px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rail{position:fixed;left:0;top:0;bottom:0;width:84px;z-index:25;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 0 14px;background:var(--bg);border-right:1px solid var(--line)}
.rlogo{display:block;margin-bottom:18px;border-radius:12px}.rlogo img{width:38px;height:38px;display:block}
#nav,#railfoot{position:relative;display:flex;flex-direction:column;gap:4px}
#railfoot .ri.on{background:var(--panel);outline:1px solid var(--line);outline-offset:-1px}
.ri{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;padding:9px 0 8px;border-radius:14px;text-decoration:none;color:var(--dim);font-size:11.5px;font-weight:600;transition:color .2s,background-color .2s}
.ri svg{width:21px;height:21px;transition:color .2s}
.ri:hover{color:var(--text);background:var(--sunk)}
.ri.on{color:var(--text)}.ri.on:hover{background:transparent}.ri.on svg{color:var(--accent)}
.ri .dotlive{position:absolute;top:7px;right:16px;width:7px;height:7px;border-radius:50%;background:var(--accent);animation:blink 1.2s ease-in-out infinite}
.rind{position:absolute;left:0;width:66px;border-radius:14px;background:var(--panel);border:1px solid var(--line);z-index:0;opacity:0;transition:top .45s var(--ease),height .45s var(--ease),opacity .2s}
.topbar{position:sticky;top:0;z-index:20;height:60px;display:flex;align-items:center;gap:10px;padding:0 22px;background:rgba(246,241,232,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .25s}
.topbar.sc{border-bottom-color:var(--line)}
.tblogo{display:none}.tblogo img{height:24px;display:block}
#topright{display:flex;align-items:center;gap:8px}
.mins{height:34px;padding:0 13px 0 10px;gap:7px}.mins svg{color:var(--accent)}
.mins:hover{border-color:var(--line-2)}
.newbtn{height:34px}
main{max-width:1240px;margin:0 auto;padding:10px 24px 90px}

/* ================================================================ home */
.home{max-width:900px;margin:0 auto}
.upsell{display:flex;align-items:center;gap:10px;width:max-content;max-width:100%;margin:6px auto 40px;padding:5px 5px 5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:13.5px;text-decoration:none;color:var(--text);transition:border-color .2s}
.upsell>svg{color:#C98A00}
.upsell b{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;white-space:nowrap;flex:none;border-radius:999px;background:var(--ink);color:#F6F1E8;font-weight:500;transition:background-color .2s}
.upsell b svg{width:14px;height:14px}
.upsell:hover{border-color:var(--line-2)}.upsell:hover b{background:var(--accent)}
.hero{text-align:center;margin:18px 0 30px}
.hello{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);margin-bottom:12px}
.hello i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(228,87,46,.45)}70%{box-shadow:0 0 0 8px rgba(228,87,46,0)}100%{box-shadow:0 0 0 0 rgba(228,87,46,0)}}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,5.4vw,64px);line-height:1.08;letter-spacing:-.02em}
.hero h1 .ai{font-style:normal;color:var(--accent)}
.rot{display:inline-block;height:1.08em;overflow:hidden;vertical-align:top;text-align:left;font-style:italic;color:var(--accent)}
.rot span{display:block;height:1.08em;animation:rot 11s var(--ease) infinite}
@keyframes rot{0%,16%{transform:translateY(0)}20%,36%{transform:translateY(-100%)}40%,56%{transform:translateY(-200%)}60%,76%{transform:translateY(-300%)}80%,100%{transform:translateY(-400%)}}
.hero .sub{color:var(--dim);font-size:16px;margin-top:12px}

/* the create card */
.maker{position:relative;max-width:780px;margin:0 auto}
.mtabs{display:flex;align-items:flex-end;gap:2px;padding:0 2px}
.mtabs>button,.mtabs>a{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px;border:1px solid transparent;border-bottom:0;border-radius:16px 16px 0 0;background:transparent;color:var(--dim);font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;transition:color .2s,background-color .2s}
.mtabs>button svg,.mtabs>a svg{width:17px;height:17px}
.mtabs>button:hover,.mtabs>a:hover{color:var(--text)}
.mtabs>button.on{position:relative;z-index:2;background:var(--panel);color:var(--text);border-color:var(--line);margin-bottom:-1px;height:45px}
.mtabs>button.on svg{color:var(--accent)}
.wsel{position:relative;display:inline-flex;align-items:center;gap:6px;height:34px;margin-bottom:6px;padding:0 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--dim);font-size:13px;transition:border-color .2s}
.wsel:hover{border-color:var(--line-2)}
.wsel select{appearance:none;-webkit-appearance:none;border:0!important;box-shadow:none!important;background:transparent!important;height:30px!important;padding:0 16px 0 0!important;width:auto!important;max-width:170px;font-weight:500;color:var(--text);cursor:pointer}
.wsel .car{position:absolute;right:9px;width:12px;height:12px;pointer-events:none}
.mcard{position:relative;z-index:1;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px;transition:border-color .25s}
.mcard.tl0{border-top-left-radius:6px}
.mcard:focus-within{border-color:#EFC3AF}
/* while the AI reads the video, a light runs round the card */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
.maker.think .mcard::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:conic-gradient(from var(--a),transparent 0 55%,#F3B79E 72%,var(--accent) 86%,transparent 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:ring 1.5s linear infinite}
@keyframes ring{to{--a:360deg}}
.linkbar{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;border:1px solid var(--line-2);border-radius:16px;background:#fff;transition:border-color .2s}
.linkbar:focus-within{border-color:var(--accent)}
.linkbar input{flex:1;min-width:0;border:0!important;box-shadow:none!important;height:46px!important;padding:0 4px!important;background:transparent!important;font-size:15.5px}
.linkbar .btn{height:46px;padding:0 20px;border-radius:12px;font-size:14.5px}
.lsrc{display:grid;place-items:center;flex:none;min-width:20px;color:var(--faint)}
.lsrc svg{width:18px;height:18px}
.src{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.02em;padding:3px 9px;border-radius:999px;color:#fff;animation:popin .4s var(--ease) both}
.src.yt{background:#E4572E}.src.tw{background:#8B6FD0}.src.kk{background:#3E9A4E}.src.web{background:var(--ink)}
@keyframes popin{0%{opacity:0;transform:scale(.4) rotate(-8deg)}70%{transform:scale(1.12)}100%{opacity:1;transform:none}}
.mquick{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:10px}
.mquick button{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border:0;border-radius:999px;background:transparent;color:var(--text);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:background-color .2s,color .2s}
.mquick button:hover{background:var(--sunk)}
.mquick button svg{width:15px;height:15px;color:var(--dim)}
.mquick .tip{margin-left:auto;font-size:12.5px;color:var(--faint)}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:6px;background:var(--panel);font:600 11.5px "Inter Tight",sans-serif;color:var(--dim)}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:6px;padding:30px 20px;border:1.5px dashed var(--line-2);border-radius:16px;background:#fff;text-align:center;color:var(--dim);cursor:pointer;transition:border-color .2s,background-color .2s,color .2s}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.dropzone .dzi{display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.dropzone .dzi svg{width:24px;height:24px;animation:hop 2.2s var(--ease) infinite}
@keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-5px)}}
.dropzone b{color:var(--text);font-size:15px}
.pend{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pendrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pendrow .btn.primary{height:46px;padding:0 20px;border-radius:12px;margin-left:auto}
/* the video that was found */
.media{display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px 10px 8px 8px;border:1px solid var(--line);border-radius:14px;background:var(--bg);animation:rise .45s var(--ease) both}
.media.bad{border-color:#F1C9C4;background:var(--bad-soft)}
.mthumb{position:relative;width:104px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:var(--sunk);flex:none;display:grid;place-items:center;color:var(--faint)}

function countUp(root) {
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  (root || document).querySelectorAll("[data-count]").forEach(el => {
    const end = Number(el.dataset.count) || 0, dec = Number(el.dataset.dec || 0), f = v => v.toLocaleString(undefined, {minimumFractionDigits: dec, maximumFractionDigits: dec});
    if (still || !end) { el.textContent = f(end); return; }
    const t0 = performance.now(), step = t => { const k = Math.min(1, (t - t0) / 1000); el.textContent = f(end * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

      inp.dispatchEvent(new Event("change", {bubbles: true})); return;
    }
    if (a === "opts") { S.ui.opts = S.ui.optsShown = !S.ui.opts; $("#maker")?.classList.toggle("open", S.ui.opts); b.setAttribute("aria-expanded", S.ui.opts); return; }
    if (a === "otab") { S.ui.otab = d.t; $$("#opts .otabs button").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-selected", x === b); }); $$("#opts .opane").forEach(x => { x.hidden = x.dataset.p !== d.t; }); return; }

      if (!/^https?:\/\/\S+\.\S+/.test(t)) return toast("There's no link on your clipboard.", true);
      $("#url").value = t; onLinkTyped(t); return;

    if (a === "saveownkey") { const done = busy(b, "Testing your key…"); try { await send("/api/me/ai", {provider: $("#own_provider").value, models: $("#own_model").value, key: $("#own_key").value}, "PUT"); toast("Your key works. The plan is active."); S.status = await api("/api/status"); drawTop(); drawNotices(); return drawPlans(); } finally { done(); } }
    if (a === "delownkey") { if (!await ask("Remove your AI key?", "Your BYOK plan pauses until you add a working key.", "Remove", true)) return; await api("/api/me/ai", {method: "DELETE"}); S.status = await api("/api/status"); drawTop(); return drawPlans(); }
    if (a === "saveai") { const done = busy(b, "Saving…"); try { const k = $("#ai_key").value.trim(); await send("/api/ai", {provider: $("#ai_provider").value, models: $("#ai_models").value, key: k || null}, "PUT"); toast("Saved. Press Test to check it."); S.status = await api("/api/status"); drawNotices(); return drawSettings(); } finally { done(); } }
    if (a === "findmodels") {
      const done = busy(b, "Finding models…");
      try {
        const r = await send("/api/ai/models", {provider: $("#ai_provider").value, key: $("#ai_key").value.trim() || undefined});
        const skip = /(embed|tts|audio|image-gen|imagen|veo|live|aqa|learnlm|gemma|vision-only|native-audio|transcribe|realtime|search|moderation|whisper|dall|davinci|babbage)/i;
        const rank = m => (/flash/i.test(m) && !/lite/i.test(m) ? 0 : /haiku|mini/i.test(m) ? 0 : /flash/i.test(m) ? 1 : /pro|sonnet|gpt/i.test(m) ? 2 : 3) * 10 - (parseFloat((m.match(/(\d+(?:\.\d+)?)/) || [0, 0])[1]) || 0) / 10;
        const ms = (r.models || []).filter(m => !skip.test(m)).sort((x, y) => rank(x) - rank(y) || y.localeCompare(x));
        if (!ms.length) return toast("The service listed no usable models for this key.", true);
        $("#ai_pick").innerHTML = ms.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
        $("#ai_pickwrap").hidden = false; $("#ai_models").value = ms[0];
        $("#ai_pick").onchange = e => { $("#ai_models").value = e.target.value; };
        toast(`Found ${ms.length} models. The first one is filled in.`);
      } finally { done(); }
      return;
    }
    if (a === "testai") {
      const done = busy(b, "Testing… (can take a few seconds)");
      try { const r = await send("/api/ai/test", {provider: $("#ai_provider").value, models: $("#ai_models").value, key: $("#ai_key").value.trim() || undefined}); toast((r.fallback ? `Works with your backup model ${r.model} (the first one was busy).` : `It works: ${r.model} answered.`) + (savedAi() ? "" : " Press Save to keep these settings.")); }
      finally { done(); }
      return;
    }
    if (a === "disconnect") { if (!await ask("Disconnect this account?", "Clips will no longer be posted to it.", "Disconnect", true)) return; await api(`/api/accounts/${d.a}`, {method: "DELETE"}); return drawSettings(); }
    if (a === "delaccount") return deleteDialog();
    if (a === "fbkind") { $$(".kind").forEach(x => x.classList.toggle("on", x === b)); $("#fbkind").value = d.k; $("#fbmsg")?.focus(); return; }
    if (a === "fbagain") return drawSettings();
    if (a === "editname") { const i = $("#nameform input"); if (i) { i.focus(); i.select(); } return; }
    if (a === "delws") { const w = wsOf(d.w), n = S.jobs.filter(j => j.creator === d.w).length;
      if (!await ask(`Delete “${w?.name || "this workspace"}”?`, `Its ${n} project${n === 1 ? "" : "s"} and every clip in ${n === 1 ? "it" : "them"} are deleted too. Download what you want to keep first. This can't be undone.`, "Delete workspace", true)) return;
      await api(`/api/creators/${d.w}`, {method: "DELETE"}); $("#dlg").open && $("#dlg").close(); S.ui.ws = ""; try { localStorage.setItem("cf_ws", ""); } catch {} await tick(true); return drawProjects(); }
    if (a === "newch") return newChannelDialog();
    if (a === "closedlg") return $("#dlg").close();
    if (a === "golive") { b.disabled = true; await send(`/api/creators/${d.c}/live`, {}); toast("Recording started"); await tick(true); return drawLive(); }
    if (a === "stoplive") { await send(`/api/live/${d.j}/stop`); toast("Stopping"); await tick(true); return drawLive(); }
    if (a === "clipnow") { await send(`/api/live/${d.j}/clip`, {seconds: Number(d.s)}); return toast("Clipping the last " + d.s + " seconds…"); }
    if (a === "autowatch") { await send(`/api/creators/${d.c}`, {auto_watch: b.checked}, "PUT"); return toast(b.checked ? "Will record by itself" : "Auto-recording off"); }
    if (a === "delch") { if (!await ask("Remove this channel?", "Its recordings stay in Projects.", "Remove", true)) return; await api(`/api/creators/${d.c}`, {method: "DELETE"}); await tick(true); return drawLive(); }
  } catch (err) { b.disabled = false; toast(err.message, true); if (err.status === 402) go("/app/plans"); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "linkform") return;
  e.preventDefault();
  const url = $("#url").value.trim(); if (!url || S.ui.looking) return;
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try { const j = await send("/api/jobs", {url, options: jobOptions(), creator: S.ui.ws || undefined}); S.ui.url = ""; S.ui.frame = null; S.ui.lookup = ""; S.ui.dur = 0; await tick(true); go(`/app/p/${j.id}`); }
  catch (err) { toast(err.message, true); if (err.status === 402) go("/app/plans"); }
  finally { btn.disabled = false; }
});
async function pickFiles(files) {
  files = files.filter(f => f.type.startsWith("video/") || /\.(mp4|mov|mkv|webm|m4v)$/i.test(f.name)); if (!files.length) return;
  S.ui.mode = "file"; S.ui.pending = files; S.ui.looking = true; drawProjects();
  const fr = await frameFromFile(files[0]); if (fr) await useFrame(fr, files[0].name); else { S.ui.opts = true; drawProjects(); }
  settle();
}
$("#file").addEventListener("change", e => { pickFiles([...e.target.files]); e.target.value = ""; });
document.addEventListener("input", e => { if (e.target.id === "url") onLinkTyped(e.target.value.trim()); });
document.addEventListener("change", e => {
  if (e.target.id === "wsel") {
    const v = e.target.value;
    if (v === "__new") { e.target.value = S.ui.ws || ""; return wsDialog(null); }
    S.ui.ws = v; S.ui.form = {}; S.ui.recipe = ""; try { localStorage.setItem("cf_ws", v); } catch {} return drawHome();
  }
  if (e.target.closest("#opts") && S.ui.recipe) {          // changed by hand: no longer the recipe as it was
    S.ui.recipe = ""; $$(".recipe.on").forEach(x => x.classList.remove("on")); const ob = $(".optbtn span"); if (ob) ob.textContent = "Style and options";
  }
  if (e.target.closest("#opts")) { (S.ui.form = S.ui.form || {})[e.target.id] = e.target.value; drawStylePreview(); const u = $("#useline"); if (u) u.textContent = useLine(); }
});
function wsDialog(ws) {
  const d = $("#dlg"), v = ws || {}, layouts = Object.keys(S.status.layouts || {}).map(k => [k, LAYOUT_SHORT[k] || k]);
  d.innerHTML = `<form class="dl" id="wsform" style="max-width:520px"><h2>${ws ? "Workspace settings" : "New workspace"}</h2>
    <p class="muted small">A workspace keeps one kind of content together (say "Valorant streams" or "Podcast"), with its own default style.</p>
    <label class="f">Name<input name="name" value="${esc(v.name || "")}" placeholder="Valorant streams" required maxlength="60"></label>
    ${pickRows({content: v.content || "auto", cam: v.cam_style || "split", style: v.style || "bounce", capbg: v.cap_bg || "none"}, g => `name="${{content: "content", cam: "cam_style", style: "style", capbg: "cap_bg"}[g]}"`)}
    <div class="formgrid" style="grid-template-columns:1fr 1fr">
      <label class="f">Layout<select name="layout">${opt(layouts, v.layout || "auto")}</select></label>
      <label class="f">Language spoken<select name="language">${opt(LANGS, v.language || "auto")}</select></label>
      <label class="f">Clips per video<input name="max_clips" type="number" min="1" max="20" value="${esc(v.max_clips || 6)}"></label></div>
    <div class="row" style="justify-content:space-between">${ws ? `<button type="button" class="btn danger" data-act="delws" data-w="${esc(ws.id)}">Delete workspace</button>` : "<span></span>"}
      <span class="row"><button type="button" class="btn" data-act="closedlg">Cancel</button><button class="btn primary">${ws ? "Save" : "Create"}</button></span></div></form>`;
  d.showModal();
  $("#wsform").onsubmit = async e => { e.preventDefault(); const f = new FormData(e.target), body = Object.fromEntries(f.entries()); body.max_clips = Number(body.max_clips) || 6;
    try { const c = ws ? await send(`/api/creators/${ws.id}`, body, "PUT") : await send("/api/creators", body); d.close(); toast(ws ? "Workspace saved" : "Workspace created");
      await tick(true); S.ui.ws = c.id; S.ui.form = {}; try { localStorage.setItem("cf_ws", c.id); } catch {} drawProjects(); } catch (err) { toast(err.message, true); } };
}
let dragN = 0;
const canDrop = e => ["home", "projects"].includes(S.route[0]) && [...(e.dataTransfer?.types || [])].includes("Files");
document.addEventListener("dragenter", e => { if (!canDrop(e)) return; dragN++; $("#dropov").hidden = false; });
document.addEventListener("dragover", e => { if (canDrop(e)) e.preventDefault(); });
document.addEventListener("dragleave", e => { if (!canDrop(e)) return; dragN = Math.max(0, dragN - 1); if (!dragN) $("#dropov").hidden = true; });
document.addEventListener("drop", e => {
  if (!canDrop(e)) return; e.preventDefault(); dragN = 0; $("#dropov").hidden = true;
  const files = [...(e.dataTransfer.files || [])]; if (!files.length) return;
  if (S.route[0] !== "home") go("/app"); pickFiles(files);
});
$("#dropov svg").innerHTML = I.up;
document.addEventListener("paste", e => {
  if (!["home", "projects"].includes(S.route[0]) || e.target.closest("input, textarea, select, [contenteditable], dialog")) return;
  const t = (e.clipboardData?.getData("text") || "").trim();
  if (!/^https?:\/\/\S+\.\S+$/.test(t)) return;
  e.preventDefault(); if (S.route[0] !== "home") go("/app");
  S.ui.mode = "link"; S.ui.url = t; drawHome(); onLinkTyped(t); toast("Got your link");
});
document.addEventListener("keydown", e => {
  if (e.key !== "/" || e.metaKey || e.ctrlKey || e.altKey || e.target.closest("input, textarea, select, [contenteditable], dialog")) return;
  if (!["home", "projects"].includes(S.route[0])) return;
  e.preventDefault(); if (S.route[0] !== "home") go("/app");
  if (S.ui.mode !== "link") { S.ui.mode = "link"; drawHome(); }
  $("#url")?.focus();
});
addEventListener("scroll", () => $("#topbar").classList.toggle("sc", scrollY > 4), {passive: true});
// a small burst of confetti when a video's clips are ready
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div"), cols = ["#E4572E", "#F3B79E", "#F3E3B3", "#D8E2CF", "#E2DCEF", "#1C1B19"];
  box.className = "confetti"; box.setAttribute("aria-hidden", "true");
  for (let i = 0; i < 80; i++) { const c = document.createElement("i");
    c.style.cssText = `left:${50 + (Math.random() - .5) * 24}%;width:${6 + Math.random() * 6}px;height:${8 + Math.random() * 9}px;background:${cols[i % cols.length]};--x:${(Math.random() - .5) * 1000}px;--y:${-(220 + Math.random() * 420)}px;--r:${Math.random() * 720 - 360}deg;animation-delay:${Math.random() * .15}s`;
    box.append(c); }
  document.body.append(box); setTimeout(() => box.remove(), 2700);
}

/* ---------------------------------------------------------------- live data */
async function tick(force) {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(force ? "" : S.v));
    S.v = got.v;
    if (!got.jobs) return;
    const before = S.jobsSeen ? Object.fromEntries(S.jobs.map(j => [j.id, j.status])) : null;
    S.jobs = got.jobs; S.creators = got.creators || []; S.accounts = got.accounts || []; S.jobsSeen = true;
    if (got.ai) S.status.ai = got.ai;
    if (got.unread != null && got.unread !== S.status.unread) {      // something new: the bell gives a little shake
      S.ui.bellRing = got.unread > (S.status.unread || 0); S.status.unread = got.unread; setTimeout(() => { S.ui.bellRing = false; }, 1200);
    }
    if (before) for (const j of S.jobs) if (["running", "queued"].includes(before[j.id]) && j.status === "done" && j.clips.length) { confetti(); toast(`Your clips are ready: ${j.title || "your video"}`); }
    const v = S.route[0];
    drawTop();
    if (v === "home" || v === "projects") drawProjectList();
    else if (v === "project") drawProject(false);
    else if (v === "live") drawLive();
    watchPosts(!S.ui.seenPosts);
  } catch {}
}
function loop() {
  const busy = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => ["queued", "rendering"].includes(c.status)
    || Object.values(c.posts || {}).some(p => p.status === "posting" || (p.status === "scheduled" && p.due_at <= Date.now() / 1000 + 20))));
  setTimeout(async () => { await tick(); loop(); }, busy ? 2000 : 6000);
}
(async () => {
  try { S.status = await api("/api/status"); } catch { return; }
  try { S.ui.ws = localStorage.getItem("cf_ws") || ""; } catch {}
  await tick(true);
  route();
  try { const link = sessionStorage.getItem("peakcut_link"); if (link) { sessionStorage.removeItem("peakcut_link"); if (S.route[0] === "home") { S.ui.mode = "link"; S.ui.url = link; drawHome(); onLinkTyped(link); } } } catch {}
  loop();
  setInterval(async () => { try { S.status = await api("/api/status"); drawTop(); drawNotices(); } catch {} }, 20000);
})();
</script>
