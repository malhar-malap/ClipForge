<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClipForge</title>
<link rel="icon" type="image/svg+xml" href="/brand/favicon.svg?v=cf4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=Archivo+Black&family=Anton&family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E8;--panel:#FFFDF9;--sunk:#F1EADF;--line:#E6DDCE;--line-2:#D6CBB8;
  --text:#1C1B19;--dim:#6E6A62;--faint:#A29C91;--ink:#1C1B19;
  --accent:#E4572E;--accent-soft:#FBE7DE;--peach:#F7D7C2;--sage:#D8E2CF;--lilac:#E2DCEF;--butter:#F3E3B3;--sky:#D3E3EC;
  --serif:"Instrument Serif",Georgia,serif;--ease:cubic-bezier(.2,.8,.2,1);
  --good:#1E7F4F;--good-soft:#E8F4EC;--warn:#8A5A00;--warn-soft:#FBF3E2;--bad:#C2352B;--bad-soft:#FBECEA;
  --r:8px;--r-lg:12px;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.5 "Inter Tight",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
svg{width:16px;height:16px;flex:none;fill:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{width:100%;height:36px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;outline:none}
textarea{height:auto;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:500;color:var(--dim)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:var(--r);border:1px solid var(--line-2);background:#fff;color:var(--text);font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:#33332f}
.btn.ghost{border-color:transparent;background:transparent;color:var(--dim)}.btn.ghost:hover{background:var(--sunk);color:var(--text)}
.btn.danger{color:var(--bad)}.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{height:28px;padding:0 9px;font-size:13px}.btn.icon{width:30px;padding:0}
.btn:disabled{opacity:.45;pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--dim);white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}.badge.warn{background:var(--warn-soft);color:var(--warn)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.blue{background:var(--accent-soft);color:var(--accent)}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.muted{color:var(--dim)}.faint{color:var(--faint)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.grow{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg)}
.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .4s ease}

/* top bar */
header.top{position:sticky;top:0;z-index:20;height:56px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.top .in{max-width:1240px;margin:0 auto;height:100%;padding:0 20px;display:flex;align-items:center;gap:6px}
header.top .logo{display:flex;align-items:center;margin-right:18px}header.top .logo img{height:24px;display:block}
header.top nav{display:flex;gap:2px}
header.top nav a{height:32px;display:inline-flex;align-items:center;padding:0 11px;border-radius:var(--r);text-decoration:none;color:var(--dim);font-weight:500}
header.top nav a:hover{color:var(--text);background:var(--sunk)}
header.top nav a.on{color:var(--text);background:var(--sunk)}
.mins{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--dim);text-decoration:none}
.mins b{color:var(--text);font-weight:600}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;border:0;cursor:pointer}
.menu{position:absolute;right:20px;top:50px;width:230px;background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 12px 32px -12px rgba(0,0,0,.18);padding:6px;z-index:30}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{display:block}.menu .who span{font-size:12.5px;color:var(--dim)}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:9px;height:34px;padding:0 10px;border:0;background:none;border-radius:6px;text-decoration:none;cursor:pointer;text-align:left}
.menu a:hover,.menu button:hover{background:var(--sunk)}

main{max-width:1240px;margin:0 auto;padding:28px 20px 80px}
.notice{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:10px 12px 10px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);background:#fff;font-size:13.5px}
.notice.warn{border-left-color:#C98A00}.notice span{flex:1}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.ph h1{font-size:22px;font-weight:600;letter-spacing:-.015em}
.ph p{color:var(--dim);margin-top:3px}
.crumb{font-size:13px;color:var(--dim);margin-bottom:6px}.crumb a{text-decoration:none}.crumb a:hover{color:var(--text)}

/* new project */
.new{padding:18px;margin-bottom:28px}
.seg{display:inline-flex;padding:3px;background:var(--sunk);border-radius:var(--r);gap:2px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--dim);font-weight:500;cursor:pointer}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.newrow{display:flex;gap:8px;margin-top:14px}
.newrow input{height:40px;font-size:14.5px}
.newrow .btn{height:40px;padding:0 18px}
.drop{margin-top:14px;border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:26px;text-align:center;color:var(--dim);cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.drop b{color:var(--text)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.ups{margin-top:12px;display:grid;gap:8px}
.up{display:grid;grid-template-columns:1fr 120px;gap:12px;align-items:center;font-size:13px}

/* projects list */
.list{overflow:hidden}
.lrow{display:grid;grid-template-columns:96px minmax(0,1fr) 170px 110px 36px;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;cursor:pointer}
.lrow:first-child{border-top:0}
.lrow:hover{background:#FAFAF8}
.thumb{width:96px;aspect-ratio:16/9;border-radius:6px;background:var(--sunk);overflow:hidden;display:grid;place-items:center;color:var(--faint)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.lrow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .m{font-size:12.5px;color:var(--dim);margin-top:2px}
.lhead{display:grid;grid-template-columns:96px minmax(0,1fr) 170px 110px 36px;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--faint);font-weight:500}
.empty{padding:48px 20px;text-align:center;color:var(--dim)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* project workspace */
.ws{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.clips{padding:6px;max-height:calc(100vh - 190px);overflow:auto;position:sticky;top:76px}
.ci{display:grid;grid-template-columns:54px minmax(0,1fr);gap:11px;padding:8px;border-radius:var(--r);cursor:pointer;border:1px solid transparent}
.ci:hover{background:var(--sunk)}
.ci.on{background:var(--accent-soft);border-color:#D6E0FB}
.ci .cv{width:54px;aspect-ratio:9/16;border-radius:5px;background:#26252200;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--faint);position:relative}
.ci .cv img{width:100%;height:100%;object-fit:cover}
.ci .h{font-weight:600;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ci .s{display:flex;gap:6px;align-items:center;margin-top:5px;font-size:12px;color:var(--dim)}
.score{font-weight:600;color:var(--text)}
.edit{padding:20px;display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:24px}
.stage{position:relative;width:100%;aspect-ratio:9/16;background:#141412;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#bbb;font-size:13px;text-align:center}
.stage video.final{width:100%;height:100%;object-fit:contain;background:#000}
.stage .msg{padding:18px;display:grid;gap:10px;justify-items:center}
.stage .msg svg{width:22px;height:22px}
.form{display:grid;gap:12px;align-content:start}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form h3{font-size:12px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.why{padding:10px 12px;border-radius:var(--r);background:var(--sunk);font-size:13px;color:var(--dim)}
.acts{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--line)}
.ck{display:flex;align-items:center;gap:8px;font-size:13.5px}

/* preview player */
.pv{position:absolute;inset:0;cursor:pointer}
.pv-p{position:absolute;overflow:hidden}.pv-p video{position:absolute;max-width:none;max-height:none}
.pv-p.bg video{filter:blur(18px) brightness(.7)}
.pv-p.bub{border-radius:50%;box-shadow:0 0 0 3px #fff}.pv-p.pipw{border-radius:10px;box-shadow:0 0 0 3px #fff}
.pv-cap{position:absolute;left:5%;right:5%;text-align:center;font:800 20px/1.15 Poppins,system-ui,sans-serif;color:#fff;text-transform:uppercase;-webkit-text-stroke:1px #000;text-shadow:0 2px 6px rgba(0,0,0,.8);pointer-events:none}
.pv-cap b{color:#FFE14D}
.pv-hook{position:absolute;left:50%;transform:translate(-50%,-50%);background:#fff;color:#191917;font:800 15px/1.2 Poppins,system-ui,sans-serif;padding:6px 12px;border-radius:10px;max-width:86%;text-align:center;pointer-events:none}
.pv-wm{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:700 26px Inter,sans-serif;color:rgba(255,255,255,.22);transform:rotate(-24deg);letter-spacing:.2em}
.pv-play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.pv-play span{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#191917}.pv-play svg{width:20px;height:20px;margin-left:3px}

/* live */
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ch{padding:16px;display:grid;gap:12px}
.ch h3{font-size:15px;font-weight:600}
.ch .links{display:flex;gap:6px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stats div{background:#fff;padding:10px 12px}.stats b{display:block;font-size:17px;font-weight:600}.stats span{font-size:12px;color:var(--dim)}

/* plans */
.now{padding:20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:24px}
.now h2{font-size:20px;font-weight:600;margin:2px 0 4px}
.now .big{text-align:right;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.now .big span{display:block;font-size:12.5px;font-weight:400;color:var(--dim);margin-top:6px;letter-spacing:0}
.now .bar{max-width:420px;margin:12px 0 6px;height:6px}
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:28px}
.plan{padding:18px;display:flex;flex-direction:column;gap:12px}
.plan.mine{border-color:var(--ink)}
.plan .pr{font-size:26px;font-weight:600;letter-spacing:-.02em}.plan .pr small{font-size:13px;color:var(--dim);font-weight:400;margin-left:3px}
.plan ul{list-style:none;padding:0;margin:0;display:grid;gap:7px;font-size:13px;color:var(--dim);flex:1}
.plan li{display:flex;gap:7px}.plan li svg{color:var(--text);margin-top:2px;width:15px;height:15px}
.plan .btn{width:100%}
.faq{display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.faq div{padding:14px 0;border-top:1px solid var(--line)}.faq b{display:block;margin-bottom:3px}.faq p{color:var(--dim);font-size:13.5px}
.sect{padding:20px;margin-bottom:16px}
.sect h2{font-size:15px;font-weight:600;margin-bottom:4px}.sect>p{color:var(--dim);margin-bottom:14px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:720px}

/* settings */
.set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.set nav{display:grid;gap:2px;position:sticky;top:76px}
.set nav a{height:34px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:var(--r);text-decoration:none;color:var(--dim);font-weight:500}
.set nav a:hover{background:var(--sunk);color:var(--text)}.set nav a.on{background:#fff;border:1px solid var(--line);color:var(--text)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t td,table.t th{padding:9px 10px;border-top:1px solid var(--line);text-align:left}
table.t th{font-weight:500;color:var(--faint);font-size:12px;border-top:0}

dialog{border:1px solid var(--line);border-radius:var(--r-lg);padding:0;max-width:440px;width:calc(100% - 32px);box-shadow:0 24px 60px -20px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(20,20,18,.35)}
dialog .dl{padding:20px;display:grid;gap:12px}dialog h2{font-size:16px;font-weight:600}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:grid;gap:8px;z-index:50}
.toast{background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r);font-size:13.5px;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.toast.bad{background:var(--bad)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid #555;border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* ================================================================ ClipForge: type, colour and motion */
.ph h1,.now h2,.sect h2.big{font-family:var(--serif);font-weight:400;font-size:44px;line-height:1;letter-spacing:-.02em}
.ph h1 em,.now h2 em{font-style:italic;color:var(--accent)}
.ph p{font-size:15px}
.btn{border-radius:999px;transition:transform .2s var(--ease),background-color .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.primary{box-shadow:0 8px 18px -12px rgba(28,27,25,.8)}
.btn.icon{border-radius:50%}
input:not([type=checkbox]):not([type=radio]):not([type=file]),select,textarea{border-radius:10px;background:#FFFDF9}
.panel{border-radius:18px;box-shadow:0 1px 0 rgba(28,27,25,.03)}
header.top{background:rgba(246,241,232,.82)}
header.top .logo img{height:26px}
header.top nav{position:relative;padding:3px;border-radius:999px;background:var(--sunk);gap:0}
header.top nav a{position:relative;z-index:1;height:30px;border-radius:999px;transition:color .25s}
header.top nav a.on{background:transparent;color:var(--text)}
header.top nav .pill{position:absolute;z-index:0;top:3px;height:30px;border-radius:999px;background:var(--panel);box-shadow:0 2px 6px -2px rgba(28,27,25,.25);transition:left .4s var(--ease),width .4s var(--ease)}
.mins{background:var(--panel)}
.mins b{font-family:var(--serif);font-size:17px;font-weight:400;color:var(--accent)}
.avatar{background:var(--accent);transition:transform .2s var(--ease)}.avatar:hover{transform:scale(1.06)}
.menu{border-radius:16px;animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.98)}}
.notice{border-radius:14px;border-left-width:4px;animation:slide .45s var(--ease) both}
@keyframes slide{from{opacity:0;transform:translateY(-6px)}}
/* page entrance and staggered items */
.enter>*{animation:rise .6s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.06s}.enter>*:nth-child(3){animation-delay:.12s}.enter>*:nth-child(4){animation-delay:.18s}.enter>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.stagger>*{animation:rise .55s var(--ease) both}
.stagger>*:nth-child(1){animation-delay:.04s}.stagger>*:nth-child(2){animation-delay:.08s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.16s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.24s}.stagger>*:nth-child(7){animation-delay:.28s}.stagger>*:nth-child(n+8){animation-delay:.32s}
.calm .stagger>*,.calm.enter>*{animation:none}
/* new project panel */
.new{position:relative;overflow:hidden;padding:22px;background:linear-gradient(135deg,#FFFDF9 0%,#FBF3EA 100%)}
.new::before{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-180px;border-radius:50%;background:var(--peach);filter:blur(50px);opacity:.7;pointer-events:none;animation:drift 16s ease-in-out infinite alternate}
.new::after{content:"";position:absolute;width:260px;height:260px;left:30%;bottom:-200px;border-radius:50%;background:var(--sage);filter:blur(50px);opacity:.6;pointer-events:none;animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-40px,30px) scale(1.1)}}
.new>*{position:relative;z-index:1}
.new h2{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.05;margin-bottom:14px}
.new h2 em{font-style:italic;color:var(--accent)}
.seg{border-radius:999px;background:rgba(241,234,223,.8)}
.seg button{border-radius:999px;transition:background .25s,color .25s}
.newrow input{height:48px;border-radius:999px;padding:0 20px;font-size:15px}
.newrow .btn{height:48px;padding:0 22px}
.drop{border-radius:18px;background:rgba(255,253,249,.6);transition:border-color .2s,background .2s,transform .2s}
.drop.over{transform:scale(1.01)}
.drop svg{width:26px;height:26px;margin-bottom:6px;color:var(--accent)}
/* projects list */
.lrow{transition:background .2s}
.lrow .faint svg{transition:transform .3s var(--ease)}
.lrow:hover .faint svg{transform:translateX(4px);color:var(--accent)}
.lrow:hover{background:#FCF6EE}
.thumb{border-radius:10px;transition:transform .35s var(--ease)}
.lrow:hover .thumb{transform:scale(1.04) rotate(-1deg)}
.badge.blue{background:var(--accent-soft);color:var(--accent)}
.badge.blue .dot,.badge.bad .dot{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.badge.good{background:#E3EEDB;color:#2F6B3A}.badge.warn{background:#F8ECCB;color:#8A6200}
.bar{height:6px;border-radius:6px;background:var(--sunk)}
.bar i{background:linear-gradient(90deg,var(--accent),#F08A5D,var(--accent));background-size:200% 100%;animation:flow 2s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.empty b{font-family:var(--serif);font-weight:400;font-size:28px;margin-bottom:6px}
/* workspace */
.ci{transition:background .2s,border-color .2s,transform .25s var(--ease);border-radius:12px}
.ci:hover{transform:translateX(3px)}
.ci.on{background:var(--accent-soft);border-color:#F3C8B6}
.ci .cv{border-radius:7px}
.score{font-family:var(--serif);font-size:17px;font-weight:400;color:var(--accent)}
.stage{border-radius:22px;box-shadow:0 30px 60px -34px rgba(28,27,25,.55);animation:rise .6s var(--ease) both}
.form h3{color:var(--accent);letter-spacing:.1em}
.why{border-radius:12px;background:#FBF1E6;border:1px solid #F1DFCB}
.why .score{font-size:20px}
.ck input{accent-color:var(--accent)}
/* live */
.ch{transition:transform .3s var(--ease),box-shadow .3s}.ch:hover{transform:translateY(-3px);box-shadow:0 24px 40px -30px rgba(28,27,25,.45)}
.ch h3{font-family:var(--serif);font-weight:400;font-size:26px}
.stats b{font-family:var(--serif);font-weight:400;font-size:24px}
.stats{border-radius:14px}
/* plans */
.now{position:relative;overflow:hidden;background:var(--ink);color:#F6F1E8;border-color:var(--ink)}
.now .muted,.now .small{color:#C9C2B5!important}
.now::after{content:"";position:absolute;width:300px;height:300px;right:-80px;top:-140px;border-radius:50%;background:var(--accent);filter:blur(60px);opacity:.35}
.now>*{position:relative;z-index:1}
.now .big{font-family:var(--serif);font-weight:400;font-size:64px;color:#F3B79E}
.now .bar{background:rgba(255,255,255,.12)}
.plan{transition:transform .35s var(--ease),box-shadow .35s}.plan:hover{transform:translateY(-4px);box-shadow:0 26px 50px -34px rgba(28,27,25,.5)}
.plan .pr{font-family:var(--serif);font-weight:400;font-size:46px;letter-spacing:-.02em}
.plan:nth-child(1){background:#FBF3EA}.plan:nth-child(2){background:#FCEFE7}.plan:nth-child(3){background:#F1F4EC}.plan:nth-child(4){background:#F2EFF7}
.plan.mine{border:1.5px solid var(--accent)}
.plan li svg{color:var(--accent)}
.faq b{font-family:var(--serif);font-weight:400;font-size:21px}
/* settings */
.set nav a{border-radius:999px;transition:background .2s,color .2s}
.set nav a.on{border-color:var(--line);background:var(--panel)}
.sect h2{font-family:var(--serif);font-weight:400;font-size:24px}
dialog{border-radius:22px;animation:pop .25s var(--ease)}
dialog h2{font-family:var(--serif);font-weight:400;font-size:26px}
.toast{border-radius:999px;padding:10px 18px;animation:toast .35s var(--ease) both}
@keyframes toast{from{opacity:0;transform:translateY(12px) scale(.96)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:980px){.ws{grid-template-columns:1fr}.clips{position:static;max-height:none;display:flex;overflow-x:auto;gap:6px}.ci{min-width:240px}
  .edit{grid-template-columns:1fr}.stage{max-width:340px;margin:0 auto}.plans{grid-template-columns:1fr 1fr}.set{grid-template-columns:1fr}.set nav{position:static;display:flex;overflow:auto}}
@media (max-width:700px){header.top .in{padding:0 12px;gap:4px}header.top .logo{margin-right:6px}header.top .logo img{height:22px}#topright{flex-wrap:nowrap}#topright .btn.icon{display:none}header.top nav a{padding:0 9px;font-size:13.5px}.ph h1{font-size:36px}.mins{display:none}.lrow,.lhead{grid-template-columns:72px minmax(0,1fr) 36px}.lrow>:nth-child(3),.lrow>:nth-child(4),.lhead>:nth-child(3),.lhead>:nth-child(4){display:none}.thumb{width:72px}
  .plans,.faq{grid-template-columns:1fr}.now{grid-template-columns:1fr}.now .big{text-align:left}.newrow{flex-direction:column}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>

  $("#view").innerHTML = `<div class="ph"><div><h1>Plans &amp; <em>minutes</em></h1><p>Prices in rupees, GST included. Minutes are the length of the clips you get. No auto-renewal.</p></div></div>
    <section class="panel now"><div><span class="small faint">${p ? "Current plan" : "You're on"}</span><h2>${p ? esc(p.label) : "Free previews"}</h2>
      <p class="muted">${p ? (p.status === "waiting_key" ? "Paid. Starts when your AI key passes its test below." : "Active until " + esc(when(p.ends_at)) + ".") : `Preview the best ${b.preview_clips || 3} clips of up to ${b.previews_left ?? 0} more videos today.`}</p>
      ${p ? `<div class="bar"><i style="width:${pct}%"></i></div><span class="small muted">${Math.round(p.used).toLocaleString()} minutes used</span>` : ""}</div>
      <div class="big">${p ? Math.round(p.left).toLocaleString() : b.previews_left ?? 0}<span>${p ? `of ${p.minutes.toLocaleString()} minutes left` : "previews left today"}</span></div></section>
    ${needKey && own ? `<section class="panel sect"><h2>Your AI key</h2><p>Creator BYOK runs the AI on your own key. We test it with one tiny request, store it encrypted, and never show it again. ${own.saved ? (own.tested ? `<span class="badge good">Working · ends in ${esc(own.key_hint)}</span>` : `<span class="badge warn">Not tested</span>`) : ""}</p>
      <div class="formgrid"><label class="f">AI service<select id="own_provider">${own.providers.map(x => `<option value="${esc(x)}" ${x === (own.provider || "anthropic") ? "selected" : ""}>${esc({anthropic: "Claude (Anthropic)", openai: "OpenAI", gemini: "Google Gemini", openrouter: "OpenRouter", groq: "Groq", xai: "Grok (xAI)"}[x] || x)}</option>`).join("")}</select></label>
        <label class="f">Model<input id="own_model" placeholder="e.g. claude-haiku-5-5" value="${esc((own.models || []).join(", "))}"></label>
        <label class="f">Key<input id="own_key" type="password" autocomplete="off" placeholder="${own.saved ? "Paste a new key to replace it" : "Paste your key"}"></label></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="saveownkey">Test and save</button>${own.saved ? `<button class="btn ghost" data-act="delownkey">Remove key</button>` : ""}</div></section>` : ""}
    <div class="plans stagger">${b.plans.filter(x => !(x.id === "trial" && b.trial_used && p?.plan !== "trial")).map(x => { const info = PLAN_INFO[x.id] || {feats: []}, mine = p?.plan === x.id;
      return `<div class="panel plan ${mine ? "mine" : ""}"><div class="row"><b>${esc(x.label)}</b><span class="grow"></span>${mine ? `<span class="badge good">Current</span>` : x.id === "creator" ? `<span class="badge">Popular</span>` : ""}</div>
        <div class="pr">₹${x.price.toLocaleString("en-IN")}<small>${x.days === 7 ? "once" : "/ month"}</small></div><p class="small muted">${esc(info.tag)}</p>
        <ul>${info.feats.map(f => `<li>${ic("check")}<span>${esc(f)}</span></li>`).join("")}</ul>
        ${mine ? `<button class="btn" disabled>Active</button>` : `<button class="btn ${x.id === "creator" ? "primary" : ""}" data-act="buy" data-plan="${esc(x.id)}">${p ? "Switch" : "Choose"}</button>`}</div>`; }).join("")}</div>
    <div class="faq"><div><b>What counts as a minute?</b><p>Only the length of clips you get in full quality. Finding moments and previewing are free.</p></div>
      <div><b>What is a free preview?</b><p>The best ${b.preview_clips || 3} clips of a video, played in your browser with a watermark.</p></div>
      <div><b>How does Creator BYOK work?</b><p>Add your own AI key; we test it, store it encrypted, and you pay the AI service directly.</p></div>
      <div><b>Can I re-edit a clip?</b><p>Yes, changing a clip you already got is free.</p></div></div>`;
}
let rzp = null;
const loadRazorpay = () => window.Razorpay ? Promise.resolve() : rzp = rzp || new Promise((ok, bad) => { const s = document.createElement("script"); s.src = "https://checkout.razorpay.com/v1/checkout.js"; s.onload = ok; s.onerror = () => { rzp = null; bad(new Error("The payment window could not load.")); }; document.head.append(s); });
async function buy(plan) {
  const o = await send("/api/billing/checkout", {plan}); await loadRazorpay(); const me = S.status.user || {};
  new window.Razorpay({key: o.key, amount: o.amount, currency: o.currency, order_id: o.order_id, name: "ClipForge", description: o.label, prefill: {email: me.email || "", name: me.name || ""}, theme: {color: "#191917"},
    handler: async r => { try { const v = await send("/api/billing/verify", r); toast(v.status === "waiting_key" ? "Paid. Add your AI key to start the plan." : "Your plan is active."); S.status = await api("/api/status"); drawPlans(); drawTop(); } catch (e) { toast(e.message, true); } }}).open();
}

/* ---------------------------------------------------------------- settings */
async function drawSettings() {
  const tab = S.route[1] || "account", me = S.status.user || {};
  const tabs = [["account", "Account", "user"], ["accounts", "Connected accounts", "send"], ...(me.is_admin ? [["ai", "AI service", "bolt"], ["usage", "AI usage", "chart"]] : [])];
  const nav = `<nav>${tabs.map(([k, l, i]) => `<a href="/app/settings/${k}" data-go="/app/settings/${k}" class="${k === tab ? "on" : ""}">${ic(i)}${l}</a>`).join("")}</nav>`;
  $("#view").innerHTML = `<div class="ph"><div><h1><em>Settings</em></h1></div></div><div class="set">${nav}<div id="sbody"><div class="muted">Loading…</div></div></div>`;
  const body = $("#sbody");
  try {
    if (tab === "account") {
      body.innerHTML = `<section class="panel sect"><h2>Profile</h2><p>${esc(me.name)} · ${esc(me.email)}${me.google ? " · signs in with Google" : ""}</p></section>
        ${S.status.accounts !== false ? `<section class="panel sect"><h2>Password</h2><p>Other devices are signed out when you change it.</p>
          <form id="pwform" class="formgrid">${me.has_password ? `<label class="f">Current password<input type="password" name="current" autocomplete="current-password" required></label>` : ""}<label class="f">New password<input type="password" name="new" autocomplete="new-password" minlength="8" required></label>
          <div style="align-self:end"><button class="btn primary">Change password</button></div></form></section>
        <section class="panel sect"><h2>Delete account</h2><p>Deletes your projects, clips and settings for good.</p><button class="btn danger" data-act="delaccount">Delete my account</button></section>` : ""}`;
      $("#pwform") && ($("#pwform").onsubmit = async e => { e.preventDefault(); try { await send("/api/auth/password", {current: e.target.current?.value || "", new: e.target.new.value}); toast("Password changed"); e.target.reset(); } catch (err) { toast(err.message, true); } });
    } else if (tab === "accounts") {
      const accs = await api("/api/accounts"), can = S.status.connect || {};
      body.innerHTML = `<section class="panel sect"><h2>Connected accounts</h2><p>Where your clips get posted. You sign in on each platform's own page.</p>
        ${accs.length ? `<table class="t"><tr><th>Platform</th><th>Account</th><th>Added</th><th></th></tr>${accs.map(a => `<tr><td>${esc(a.label)}</td><td>${esc(a.name)}</td><td class="muted">${esc(when(a.added))}</td><td style="text-align:right"><button class="btn sm danger" data-act="disconnect" data-a="${esc(a.id)}">Disconnect</button></td></tr>`).join("")}</table>` : `<p class="faint">Nothing connected yet.</p>`}
        <div class="row" style="margin-top:14px">${["youtube", "instagram", "tiktok"].map(pl => can[pl] ? `<a class="btn" href="/oauth/${pl}/start">${ic("plus")}Connect ${({youtube: "YouTube", instagram: "Instagram", tiktok: "TikTok"})[pl]}</a>` : `<button class="btn" disabled title="Not set up on this server">${({youtube: "YouTube", instagram: "Instagram", tiktok: "TikTok"})[pl]} not available</button>`).join("")}</div></section>`;
    } else if (tab === "ai") {
      const k = await api("/api/ai");
      body.innerHTML = `<section class="panel sect"><h2>AI service</h2><p>The AI picks the moments and writes hooks and titles for the Auto plans. ${k.ready ? `<span class="badge good">Ready · ${esc(k.label)}</span>` : `<span class="badge warn">Not set up</span>`}</p>
        <div class="formgrid"><label class="f">Service<select id="ai_provider">${k.providers.map(x => `<option value="${esc(x.id)}" ${x.id === k.provider ? "selected" : ""}>${esc(x.label)}</option>`).join("")}</select></label>
          <label class="f">Key<input id="ai_key" type="password" autocomplete="off" placeholder="${k.has_key ? "Saved" + (k.key_hint ? ", ends in " + esc(k.key_hint) : "") + ". Paste to replace" : "Paste your key"}"></label>
          <label class="f">Model<span class="row" style="flex-wrap:nowrap"><input id="ai_models" value="${esc(k.models.join(", "))}" placeholder="Press Find models"><button class="btn" data-act="findmodels" type="button">Find models</button></span></label></div>
        <div id="ai_pickwrap" class="formgrid" style="margin-top:12px" hidden><label class="f">Models your key can use (recommended first)<select id="ai_pick"></select></label></div>
        <p class="small muted" style="margin-top:10px">Paste your key, press <b>Find models</b>, pick one, then <b>Save</b> and <b>Test</b>. A fast model that can read images (Gemini Flash, Claude Haiku, GPT mini) is best: it also frames your clips.</p>
        <div class="row" style="margin-top:12px"><button class="btn primary" data-act="saveai">Save</button><button class="btn" data-act="testai">Test</button></div></section>`;
    } else if (tab === "usage") {
      const u = await api("/api/usage"), k = u.totals || u;
      body.innerHTML = `<section class="panel sect"><h2>AI usage</h2><p>Requests and tokens across the server.</p>
        <table class="t"><tr><th>When</th><th>What</th><th>Video</th><th style="text-align:right">Tokens</th></tr>${(u.recent || []).slice(0, 40).map(r => `<tr><td class="muted">${esc(when(r.t))}</td><td>${esc(r.purpose)}</td><td class="muted">${esc(r.where || "")}</td><td style="text-align:right">${(r.tokens || 0).toLocaleString()}</td></tr>`).join("") || `<tr><td colspan="4" class="faint">No AI calls yet.</td></tr>`}</table></section>`;
    }
  } catch (e) { body.innerHTML = `<div class="panel empty">${esc(e.message)}</div>`; }
}

/* ---------------------------------------------------------------- actions */
document.addEventListener("click", async e => {
  const g = e.target.closest("[data-go]");
  if (g && !e.metaKey && !e.ctrlKey && !e.shiftKey) { e.preventDefault(); return go(g.dataset.go); }
  if (!e.target.closest("#menu") && !e.target.closest("[data-act=menu]")) $("#menu").hidden = true;
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  if (b.type === "checkbox" && a !== "autowatch") return;
  try {
    if (a === "menu") { $("#menu").hidden = !$("#menu").hidden; return; }
    if (a === "logout") { await send("/api/auth/logout"); location.href = "/login"; return; }
    if (a === "resend") { await send("/api/auth/resend-verification"); return toast("Sent. Check your inbox."); }
    if (a === "mode") { S.ui.mode = d.m; return drawProjects(); }
    if (a === "opts") { S.ui.opts = !S.ui.opts; $("#opts").hidden = !S.ui.opts; b.innerHTML = ic("sliders") + (S.ui.opts ? "Hide options" : "Options"); return; }
    if (a === "pick") return $("#file").click();
    if (a === "pickclip") { S.sel[S.route[1]] = d.c; history.replaceState(null, "", `/app/p/${S.route[1]}/${d.c}`); S.route = parse(location.pathname); return drawProject(true); }
    if (a === "deljob") { if (!await ask("Delete this project?", "Its clips are deleted too. This can't be undone.", "Delete", true)) return; await api(`/api/jobs/${d.j}`, {method: "DELETE"}); await tick(true); return go("/app"); }
    if (a === "delclip") { if (!await ask("Delete this clip?", "This can't be undone.", "Delete", true)) return; await api(`/api/jobs/${d.j}/clips/${d.c}`, {method: "DELETE"}); delete S.sel[d.j]; await tick(true); return drawProject(true); }
    if (a === "unlock" || a === "unlockall") {
      if (billingOn() && B().plan?.status !== "active") return go("/app/plans");
      const j = jobOf(d.j), ids = a === "unlock" ? [d.c] : j.clips.filter(c => isPreviewState(c.status)).map(c => c.id);
      b.disabled = true; for (const id of ids) await send(`/api/jobs/${d.j}/clips/${encodeURIComponent(id)}/unlock`);
      toast(ids.length > 1 ? `Making ${ids.length} clips…` : "Making the full clip…"); return tick(true);
    }
    if (a === "remake") {
      const f = {}; $$("#wsform [data-f]").forEach(i => f[i.dataset.f] = i.type === "number" ? Number(i.value) : i.value);
      b.disabled = true; await send(`/api/jobs/${d.j}/clips/${d.c}/render`, f); toast("Re-making the clip…"); return tick(true);
    }
    if (a === "copy") { const c = jobOf(d.j)?.clips.find(x => x.id === d.c); await navigator.clipboard.writeText([c.title, c.description, (c.hashtags || []).map(h => "#" + h).join(" ")].filter(Boolean).join("\n\n")); return toast("Copied"); }
    if (a === "post") { const accs = $$("[data-pacc]:checked").map(i => i.value); if (!accs.length) return toast("Pick an account first", true); await send("/api/posts", {job: d.j, clip: d.c, accounts: accs, now: !!d.now}); return toast(d.now ? "Posting now" : "Added to the queue"); }
    if (a === "buy") { b.disabled = true; try { await buy(d.plan); } finally { b.disabled = false; } return; }
    if (a === "saveownkey") { b.disabled = true; try { await send("/api/me/ai", {provider: $("#own_provider").value, models: $("#own_model").value, key: $("#own_key").value}, "PUT"); toast("Your key works. The plan is active."); S.status = await api("/api/status"); drawTop(); drawNotices(); return drawPlans(); } finally { b.disabled = false; } }
    if (a === "delownkey") { if (!await ask("Remove your AI key?", "Your BYOK plan pauses until you add a working key.", "Remove", true)) return; await api("/api/me/ai", {method: "DELETE"}); S.status = await api("/api/status"); drawTop(); return drawPlans(); }
    if (a === "saveai") { const k = $("#ai_key").value.trim(); await send("/api/ai", {provider: $("#ai_provider").value, models: $("#ai_models").value, key: k || null}, "PUT"); toast("Saved"); S.status = await api("/api/status"); drawNotices(); return drawSettings(); }
    if (a === "findmodels") {
      b.disabled = true;
      try {
        const r = await send("/api/ai/models", {provider: $("#ai_provider").value, key: $("#ai_key").value.trim() || undefined});
        const skip = /(embed|tts|audio|image-gen|imagen|veo|live|aqa|learnlm|gemma|vision-only|native-audio|transcribe|realtime|search|moderation|whisper|dall|davinci|babbage)/i;
        const rank = m => (/flash/i.test(m) && !/lite/i.test(m) ? 0 : /haiku|mini/i.test(m) ? 0 : /flash/i.test(m) ? 1 : /pro|sonnet|gpt/i.test(m) ? 2 : 3) * 10 - (parseFloat((m.match(/(\d+(?:\.\d+)?)/) || [0, 0])[1]) || 0) / 10;
        const ms = (r.models || []).filter(m => !skip.test(m)).sort((x, y) => rank(x) - rank(y) || y.localeCompare(x));
        if (!ms.length) return toast("The service listed no usable models for this key.", true);
        $("#ai_pick").innerHTML = ms.map(m => `<option value="${esc(m)}">${esc(m)}</option>`).join("");
        $("#ai_pickwrap").hidden = false; $("#ai_models").value = ms[0];
        $("#ai_pick").onchange = e => { $("#ai_models").value = e.target.value; };
        toast(`Found ${ms.length} models. The first one is filled in.`);
      } finally { b.disabled = false; }
      return;
    }
    if (a === "testai") { b.disabled = true; try { const r = await send("/api/ai/test"); toast(`Works: ${r.model}`); } finally { b.disabled = false; } return; }
    if (a === "disconnect") { if (!await ask("Disconnect this account?", "Clips will no longer be posted to it.", "Disconnect", true)) return; await api(`/api/accounts/${d.a}`, {method: "DELETE"}); return drawSettings(); }
    if (a === "delaccount") {
      const em = prompt("Type your email address to delete your account for good:"); if (!em) return;
      await send("/api/account/delete", {confirm: em}); location.href = "/"; return;
    }
    if (a === "newch") return newChannelDialog();
    if (a === "closedlg") return $("#dlg").close();
    if (a === "golive") { b.disabled = true; await send(`/api/creators/${d.c}/live`, {}); toast("Recording started"); await tick(true); return drawLive(); }
    if (a === "stoplive") { await send(`/api/live/${d.j}/stop`); toast("Stopping"); await tick(true); return drawLive(); }
    if (a === "clipnow") { await send(`/api/live/${d.j}/clip`, {seconds: Number(d.s)}); return toast("Clipping the last " + d.s + " seconds…"); }
    if (a === "autowatch") { await send(`/api/creators/${d.c}`, {auto_watch: b.checked}, "PUT"); return toast(b.checked ? "Will record by itself" : "Auto-recording off"); }
    if (a === "delch") { if (!await ask("Remove this channel?", "Its recordings stay in Projects.", "Remove", true)) return; await api(`/api/creators/${d.c}`, {method: "DELETE"}); await tick(true); return drawLive(); }
  } catch (err) { b.disabled = false; toast(err.message, true); if (err.status === 402) go("/app/plans"); }
});
document.addEventListener("submit", async e => {
  if (e.target.id !== "linkform") return;
  e.preventDefault();
  const url = $("#url").value.trim(); if (!url) return;
  const btn = e.target.querySelector("button"); btn.disabled = true;
  try { const j = await send("/api/jobs", {url, options: jobOptions()}); await tick(true); go(`/app/p/${j.id}`); }
  catch (err) { toast(err.message, true); if (err.status === 402) go("/app/plans"); }
  finally { btn.disabled = false; }
});
$("#file").addEventListener("change", e => { [...e.target.files].forEach(uploadFile); e.target.value = ""; });
document.addEventListener("dragover", e => { if ($("#drop")) { e.preventDefault(); $("#drop").classList.add("over"); } });
document.addEventListener("dragleave", e => { if ($("#drop") && !e.relatedTarget) $("#drop").classList.remove("over"); });
document.addEventListener("drop", e => { if (!$("#drop")) return; e.preventDefault(); $("#drop").classList.remove("over"); [...e.dataTransfer.files].filter(f => f.type.startsWith("video/") || /\.(mp4|mov|mkv|webm|m4v)$/i.test(f.name)).forEach(uploadFile); });

/* ---------------------------------------------------------------- live data */
async function tick(force) {
  try {
    const got = await api("/api/sync?v=" + encodeURIComponent(force ? "" : S.v));
    S.v = got.v;
    if (!got.jobs) return;
    S.jobs = got.jobs; S.creators = got.creators || []; S.accounts = got.accounts || [];
    if (got.ai) S.status.ai = got.ai;
    const v = S.route[0];
    if (v === "projects" && !$("#url:focus") && !S.ui.uploads.length) { const val = $("#url")?.value; drawProjects(); if (val && $("#url")) $("#url").value = val; }
    else if (v === "project") drawProject(false);
    else if (v === "live") drawLive();
  } catch {}
}
function loop() {
  const busy = S.jobs.some(j => ["queued", "running", "live"].includes(j.status) || j.clips.some(c => ["queued", "rendering"].includes(c.status)));
  setTimeout(async () => { await tick(); loop(); }, busy ? 2000 : 6000);
}
(async () => {
  try { S.status = await api("/api/status"); } catch { return; }
  await tick(true);
  route();
  try { const link = sessionStorage.getItem("peakcut_link"); if (link) { sessionStorage.removeItem("peakcut_link"); if (S.route[0] === "projects") { $("#url").value = link; toast("Your link is ready. Press Find clips."); } } } catch {}
  loop();
  setInterval(async () => { try { S.status = await api("/api/status"); drawTop(); drawNotices(); } catch {} }, 20000);
})();
</script>
